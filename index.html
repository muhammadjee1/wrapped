<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#e7e3d2" />
  <title>Muhammad &amp; Haniya — A Relationship Wrapped</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" id="stage" aria-label="Relationship Wrapped story">
    <!-- card content (built by app.js) -->
    <div class="cards" id="cards"></div>

    <!-- navigation tap zones -->
    <div class="tap">
      <div class="z prev" id="tap-prev" aria-label="previous"></div>
      <div class="z next" id="tap-next" aria-label="next"></div>
    </div>

    <!-- scalloped frame (injected) + corner heart -->
    <div id="frame-holder"></div>
    <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z" />
    </svg>

    <!-- sound toggle (music autoplays on first tap; this silences it) -->
    <button id="mute" class="mute" aria-label="Toggle sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/>
        <path class="wave" d="M15 9.2a4 4 0 0 1 0 5.6"/>
        <path class="wave" d="M17.4 7a7 7 0 0 1 0 10"/>
        <line class="slash" x1="3.5" y1="3.5" x2="20.5" y2="20.5"/>
      </svg>
    </button>
  </main>

  <!-- ambient track (trimmed to start at 0:25), loops; starts on first tap -->
  <audio id="bgm" loop preload="auto">
    <source src="audio/song.mp3" type="audio/mpeg" />
  </audio>

  <script src="data.js"></script>
  <script src="frame.js"></script>
  <script src="cards.js"></script>
  <script>document.getElementById("frame-holder").innerHTML = FRAME.svg();</script>
  <script src="app.js"></script>
</body>
</html>
